{% extends "base.html" %}
{% block title %}Produsele noastre{% endblock %}

{% block content %}
<h2 class="text-center mb-4">Produsele noastre</h2>

<!-- GRID cu produse -->
<div class="row">
  {% for product in products %}
  <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4">
    <div class="card h-100 shadow-sm">
      <div class="text-center" style="height: 250px; overflow: hidden;">
        <img src="{{ url_for('static', filename=product.image) }}"
             class="img-fluid"
             style="object-fit: cover; height: 100%; width: 100%;"
             alt="{{ product.name }}">
      </div>
      <div class="card-body d-flex flex-column text-center">
        <h5 class="card-title">{{ product.name }}</h5>
        <p class="card-text text-muted">{{ product.price }} RON</p>
        <a href="{{ url_for('add_to_cart') }}?id={{ product.id }}" class="btn btn-success btn-sm mt-auto">Cumpără</a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
